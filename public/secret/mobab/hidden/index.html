<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#111a16">
  <title>모시래 식단 · 290</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#edf3e9;background:#111a16;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,a{font:inherit}button{cursor:pointer}a{color:inherit}.shell{max-width:1080px;margin:auto;padding:28px 24px 72px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.mark{font-size:12px;font-weight:800;letter-spacing:.14em;color:#98bfa1}.source{font-size:13px;color:#bed5c0;text-decoration:none;border:1px solid #496c50;border-radius:99px;padding:9px 13px}.hero{padding:60px 0 38px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;color:#96c9a0}.hero h1{font-size:clamp(36px,7vw,64px);letter-spacing:-.06em;line-height:1.12;margin:12px 0}.hero p{color:#aabcae;margin:0;line-height:1.6}.panel{border:1px solid #354c3c;background:#1b2820;border-radius:24px;padding:25px;box-shadow:0 20px 50px #0002}.toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}.toolbar h2{font-size:22px;letter-spacing:-.03em;margin:0}.refresh{background:#304b36;border:1px solid #55735b;color:#edf3e9;padding:10px 14px;border-radius:11px}.refresh:hover,.date:hover{background:#3b6044}.status{font-size:13px;color:#9ab19d;min-height:20px;margin:12px 0 23px}.datebar{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:20px}.date{flex:0 0 90px;background:#243429;border:1px solid #38533e;color:#cbdbcd;border-radius:12px;padding:11px 8px;text-align:center}.date strong,.date span{display:block}.date strong{font-size:14px}.date span{font-size:12px;margin-top:3px}.date.active{background:#9bd3a2;border-color:#9bd3a2;color:#122319}.meals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.meal{background:#223228;border:1px solid #3b5541;border-radius:18px;padding:21px}.meal small{font-size:11px;letter-spacing:.14em;font-weight:800;color:#9acba3}.meal h3{font-size:23px;margin:7px 0 17px}.meal ul{list-style:none;padding:0;margin:0;line-height:1.9}.meal li{border-bottom:1px solid #35503b;padding:3px 0}.meal li:last-child{border:0}.nutrition{color:#b7ddb9;background:#304b36;border-radius:9px;padding:10px 12px;font-size:13px;font-weight:700;margin-top:18px}.empty,.error{padding:25px;border:1px solid #526349;border-radius:14px;color:#c7d4bd}.error{background:#3c2925;border-color:#805447}.note{color:#819b86;font-size:12px;line-height:1.6;margin:20px 2px 0}button:focus-visible,a:focus-visible{outline:3px solid #f4c06a;outline-offset:3px}@media(max-width:720px){.shell{padding:22px 16px 48px}.hero{padding:45px 0 28px}.panel{padding:18px}.meals{grid-template-columns:1fr}.meal{padding:18px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="top"><span class="mark">290 / HIDDEN</span><a class="source" href="https://dorm.kku.ac.kr/weekly_diet.do?menuSeq=43860&amp;bachelor=MO" target="_blank" rel="noopener noreferrer">학교 원본 ↗</a></div>
    <header class="hero"><div class="eyebrow">MOSIRAE DORMITORY</div><h1>오늘 뭐 먹지?</h1><p>모시래학사 식단을 오늘과 내일 중심으로 보여줍니다.</p></header>
    <section class="panel" aria-label="모시래학사 식단">
      <div class="toolbar"><h2 id="heading">식단 불러오는 중</h2><button id="refresh" class="refresh" type="button">새로고침 ↻</button></div>
      <p id="status" class="status" role="status">학교 홈페이지에 연결하고 있습니다.</p>
      <div id="datebar" class="datebar" aria-label="날짜 선택"></div>
      <div id="meals" class="meals"><div class="empty">메뉴를 불러오는 중입니다…</div></div>
      <p class="note">출처: 건국대학교 글로컬캠퍼스 생활관. 학교 사정에 따라 메뉴가 바뀔 수 있습니다. 이 페이지의 주소를 아는 사람은 식단을 볼 수 있습니다.</p>
    </section>
    <section class="panel" style="margin-top:20px" aria-label="카카오톡 자동 발송 설정">
      <div class="toolbar"><h2>카카오톡 자동 발송</h2><span class="status">매일 오전 9시 · 한국시간</span></div>
      <p class="note">관리자 암호를 입력해 카카오 계정을 연결하세요. 암호는 브라우저에 저장되지 않습니다.</p>
      <form id="kakao-form" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:18px">
        <input id="admin-token" type="password" autocomplete="off" aria-label="관리자 암호" placeholder="관리자 암호" required style="min-width:220px;flex:1;background:#223228;color:#edf3e9;border:1px solid #55735b;border-radius:11px;padding:10px 14px">
        <button class="refresh" type="submit">카카오 연결</button>
        <button id="send-test" class="refresh" type="button">지금 시험 발송</button>
      </form>
      <p id="kakao-status" class="status" role="status"></p>
    </section>
  </main>
  <script>
    const state={days:[],selected:0};
    const names=['일','월','화','수','목','금','토'];
    const heading=document.querySelector('#heading');
    const status=document.querySelector('#status');
    const datebar=document.querySelector('#datebar');
    const meals=document.querySelector('#meals');
    function node(tag,text,cls){const element=document.createElement(tag);element.textContent=text||'';if(cls)element.className=cls;return element}
    function seoulDate(offset=0){const now=new Date();const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now);const get=x=>parts.find(p=>p.type===x).value;const date=new Date(Date.UTC(Number(get('year')),Number(get('month'))-1,Number(get('day'))+offset));return date.toISOString().slice(0,10)}
    function render(){datebar.replaceChildren();meals.replaceChildren();const today=seoulDate();const tomorrow=seoulDate(1);state.days.forEach((day,index)=>{const date=new Date(day.date+'T12:00:00');const label=day.date===today?'오늘':day.date===tomorrow?'내일':names[date.getDay()]+'요일';const button=node('button','','date'+(index===state.selected?' active':''));button.type='button';button.setAttribute('aria-pressed',index===state.selected?'true':'false');button.append(node('strong',label),node('span',day.date.slice(5).replace('-','.')));button.onclick=()=>{state.selected=index;render()};datebar.append(button)});const day=state.days[state.selected];if(!day)return;heading.textContent=(day.date===today?'오늘':day.date===tomorrow?'내일':names[new Date(day.date+'T12:00:00').getDay()]+'요일')+' 메뉴 · '+day.date;['아침','점심','저녁'].forEach((name,index)=>{const card=node('article','','meal');card.append(node('small','MEAL 0'+(index+1)),node('h3',name));const lines=(day.meals[name]||'').split(String.fromCharCode(10)).map(s=>s.trim()).filter(Boolean);const nutrition=lines.length&&/kcal/i.test(lines.at(-1))?lines.pop():'';if(lines.length){const list=node('ul');lines.forEach(line=>list.append(node('li',line)));card.append(list)}else card.append(node('p','등록된 메뉴가 없습니다.'));if(nutrition)card.append(node('div',nutrition,'nutrition'));meals.append(card)})}
    async function load(force=false){status.textContent='학교 홈페이지에서 식단을 불러오는 중입니다.';try{const response=await fetch('/secret/mobab/hidden/api/menu'+(force?'?refresh=1':''));const data=await response.json();if(!response.ok)throw Error(data.error||'식단을 가져오지 못했습니다.');state.days=data.days;const today=seoulDate();state.selected=Math.max(0,data.days.findIndex(day=>day.date===today));status.textContent=(data.stale?'마지막으로 확인된 식단 · ':'학교 홈페이지 기준 · ')+new Date(data.fetchedAt).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'});render()}catch(error){if(!state.days.length){heading.textContent='식단을 표시할 수 없습니다';datebar.replaceChildren();meals.replaceChildren(node('div',error.message+' 학교 원본에서 확인해 주세요.','error'))}status.textContent='연결 상태를 확인해 주세요.'}}
    const kakaoStatus=document.querySelector('#kakao-status');
    const connection=new URL(location.href).searchParams.get('connect');
    if(connection==='success')kakaoStatus.textContent='카카오 계정이 연결됐습니다.';
    else if(connection)kakaoStatus.textContent='카카오 연결에 실패했습니다. 설정을 확인해 주세요.';
    async function kakaoAction(path){
      const adminToken=document.querySelector('#admin-token').value;
      if(!adminToken){kakaoStatus.textContent='관리자 암호를 입력해 주세요.';return}
      kakaoStatus.textContent='처리 중입니다.';
      try{const response=await fetch('/secret/mobab/hidden/api/'+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({adminToken})});const data=await response.json();if(!response.ok)throw Error(data.error||'요청에 실패했습니다.');if(path==='connect'){location.href=data.url;return}kakaoStatus.textContent=`시험 발송 완료: ${data.sent}건`}
      catch(error){kakaoStatus.textContent=error.message}
    }
    document.querySelector('#kakao-form').onsubmit=event=>{event.preventDefault();kakaoAction('connect')};
    document.querySelector('#send-test').onclick=()=>kakaoAction('send-test');
    document.querySelector('#refresh').onclick=()=>load(true);load();
  </script>
</body>
</html>
